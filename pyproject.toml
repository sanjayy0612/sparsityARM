[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-sparse"
version = "0.1.0"
description = "Reference contextual and block-sparse FFN execution for Arm CPUs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch"]
model = ["torch", "transformers>=5.15,<6", "safetensors", "huggingface-hub", "psutil>=5.9"]
data = ["pyarrow>=17,<22"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["armsparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
