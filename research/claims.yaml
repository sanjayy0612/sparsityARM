# Verified means checked against the retained artifacts, not a publication claim.
claims:
  - id: C001
    type: quantitative_observation
    status: verified
    statement: At B=32 and target 40% sparsity, clustered synthetic masks yielded native-block speedup of 1.031 to 1.042 times versus base native irregular across three runs.
    scope: Apple M2, FP32, one thread, synthetic 2048/8192 SwiGLU, equal neuron sets
    evidence:
      - experiment: EXP-001
        artifacts:
          - results/EXP-001/m2-primary-20260906/run1-B32-s40-clustered.json
          - results/EXP-001/m2-primary-20260906/run2-B32-s40-clustered.json
          - results/EXP-001/m2-primary-20260906/run3-B32-s40-clustered.json
    calculation: Per-run median irregular_native latency divided by median block_native latency; range rounded to three decimals
    limitation: Descriptive result without a significance test; does not establish a benefit from computing additional neurons or an optimum
  - id: C002
    type: quantitative_observation
    status: verified
    statement: Scattered mask expansion at B=16,32,64 retained zero block sparsity in every saved mask in this sweep.
    scope: Synthetic uniformly scattered fixed-count active neurons at target 20/30/40 percent sparsity
    evidence:
      - experiment: EXP-001
        manifest: results/EXP-001/m2-primary-20260906/manifest.json
        case_filter: family=scattered and block_size in [16,32,64]
        field: realized_sparsity_block
    limitation: Does not establish the spatial distribution of real-model contextual masks
  - id: C003
    type: quantitative_observation
    status: verified
    statement: For Llama 3.2 1B magnitude masks, exact expansion yielded zero block sparsity for every analyzed layer/token at B=32 and B=64 across target neuron sparsities of 20, 30, and 40 percent.
    scope: Pinned Llama 3.2 1B, CPU BF16 teacher-forced prefill, eight fixed 64-token prompts, positions 8 through 63, all 16 layers
    evidence:
      - experiment: EXP-002
        capture_manifest: results/EXP-002/m2-primary-20260908/manifest.json
        metrics: results/EXP-002/m2-primary-20260908/analysis/metrics.csv
        analysis_manifest: results/EXP-002/m2-primary-20260908/analysis/manifest.json
        case_filter: block_size in [32, 64] and target_sparsity in [0.2, 0.3, 0.4]
        field: expanded_sparsity
    calculation: Exact per-token expansion of absolute post-SwiGLU activation top-k masks; independently validated across 7168 layer/token activations per configuration
    limitation: Pilot prompt corpus and magnitude-reference masks; does not reject learned block-aware selection or neuron reordering
  - id: C004
    type: quantitative_observation
    status: verified
    statement: At B=8, mean surviving sparsity after exact expansion was 0.000218, 0.006907, and 0.065817 percent for target neuron sparsities of 20, 30, and 40 percent respectively.
    scope: Same capture as C003
    evidence:
      - experiment: EXP-002
        aggregate: results/EXP-002/m2-primary-20260908/analysis/aggregate.json
        metrics: results/EXP-002/m2-primary-20260908/analysis/metrics.csv
    calculation: Equal-weight mean over 7168 correlated layer/token activations per configuration
    limitation: Descriptive pilot result; not independent statistical samples, quality, or execution latency
  - id: C005
    type: quantitative_observation
    status: verified
    statement: Direct B=8 block selection retained mean activation L1 mass of 90.0508, 83.2581, and 75.4741 percent at block sparsities of approximately 20, 30, and 40 percent respectively.
    scope: Same capture as C003; blocks selected by summed absolute activation
    evidence:
      - experiment: EXP-002
        aggregate: results/EXP-002/m2-primary-20260908/analysis/aggregate.json
        field: budget_retained_l1
    calculation: Equal-weight mean over 7168 correlated layer/token activations per configuration
    limitation: Activation L1 retention is not language quality, task accuracy, FFN output error, or deployable selector behavior
  - id: C006
    type: quantitative_observation
    status: verified
    statement: At 30% neuron sparsity, activation-magnitude neuron top-k increased screening perplexity from 22.7742 to 22.8210, a relative increase of 0.206 percent.
    scope: Pinned Llama 3.2 1B, CPU BF16, 16 deterministic WikiText-2 raw test excerpts, 2032 predicted tokens
    evidence:
      - experiment: EXP-003
        manifest: results/EXP-003/m2-screening-20260909/manifest.json
        condition: neuron-s30
    limitation: Post-SwiGLU oracle/reference selection on a small screening subset; not deployable selection or broad quality validation
  - id: C007
    type: quantitative_observation
    status: verified
    statement: At 30% block sparsity, direct activation-sum masks at B=8,16,32,64 increased screening perplexity by 21.314, 37.621, 62.077, and 78.377 percent respectively; none met the preregistered 5 percent threshold.
    scope: Same EXP-003 screening corpus and model as C006
    evidence:
      - experiment: EXP-003
        manifest: results/EXP-003/m2-screening-20260909/manifest.json
        conditions: [block-B8-s30, block-B16-s30, block-B32-s30, block-B64-s30]
    limitation: One sparsity level and one block-scoring rule on a small corpus; does not reject lower sparsity, contribution-aware scoring, learned selection, or neuron reordering
  - id: C008
    type: quantitative_observation
    status: verified
    statement: Output-norm-ranked B8 masks at 10% block sparsity increased screening perplexity from 22.7742 to 23.3481, a 2.520% increase that met the preregistered 5% gate.
    scope: Pinned Llama 3.2 1B, CPU BF16, 16 deterministic WikiText-2 raw test excerpts, 2032 predicted tokens
    evidence:
      - experiment: EXP-004
        manifest: results/EXP-004/m2-oracle-screening-20260909/manifest.json
        condition: block_output_norm-B8-s10
    limitation: Small-corpus post-SwiGLU oracle screening; not deployable selection, broad quality validation, or speed evidence
  - id: C009
    type: quantitative_observation
    status: verified
    statement: In the same output-norm screening, B8 at 20% and 30% and B16 at 10%, 20%, and 30% all exceeded the preregistered 5% relative perplexity threshold.
    scope: Same EXP-004 screening corpus and model as C008
    evidence:
      - experiment: EXP-004
        manifest: results/EXP-004/m2-oracle-screening-20260909/manifest.json
        conditions: [block_output_norm-B8-s20, block_output_norm-B8-s30, block_output_norm-B16-s10, block_output_norm-B16-s20, block_output_norm-B16-s30]
    limitation: Does not test intermediate sparsity, other block layouts, trained selectors, or a full evaluation corpus
  - id: C010
    type: quantitative_observation
    status: verified
    statement: With real B8 replay masks at 9.961% realized sparsity, the native packed-block FFN was 37.26% to 38.77% slower than optimized dense across three M2 runs.
    scope: Apple M2, FP32, one thread, synthetic 2048/8192 SwiGLU weights and inputs, 16 real Llama-derived replay masks
    evidence:
      - experiment: EXP-005
        manifest: results/EXP-005/m2-replay-20260909/manifest.json
        cases: [run1-B8-s10-replay.json, run2-B8-s10-replay.json, run3-B8-s10-replay.json]
    calculation: Per-run native block median divided by Accelerate dense median minus one
    limitation: Portable standalone kernel; does not reject optimized assembly, quantization, reordering, other hardware, or end-to-end systems
  - id: C011
    type: quantitative_observation
    status: verified
    statement: At the same 9.961% replay sparsity, native irregular execution was only 0.93% to 3.51% faster than dense across three runs, versus an idealized 11.06% projection-only speedup.
    scope: Same EXP-005 conditions as C010
    evidence:
      - experiment: EXP-005
        manifest: results/EXP-005/m2-replay-20260909/manifest.json
    calculation: Dense median divided by native irregular median minus one; idealized speedup is 1/(1-realized sparsity)-1
    limitation: Dense and irregular use different layouts/backends; no hardware counters or significance test
  - id: C012
    type: quantitative_observation
    status: verified
    statement: A fixed calibration-only LSH neuron layout improved all four matched B8/B16 output-norm screening perplexities relative to original order, but every reordered 20% and 30% configuration still exceeded the preregistered 5% degradation threshold.
    scope: Pinned Llama 3.2 1B, CPU BF16, 16 deterministic held-out WikiText-2 excerpts, 2032 predicted tokens
    evidence:
      - experiment: EXP-006
        manifest: results/EXP-006/m2-reordered-screening-20260909/manifest.json
        conditions: [block_output_norm-B8-s20, block_output_norm-B8-s30, block_output_norm-B16-s20, block_output_norm-B16-s30, block_output_norm-B32-s20, block_output_norm-B32-s30]
      - experiment: EXP-004
        manifest: results/EXP-004/m2-oracle-screening-20260909/manifest.json
    limitation: Small screening corpus and one inexpensive LSH layout; B32 has no matched original-order output-norm baseline and is excluded from the improvement comparison
  - id: C013
    type: quantitative_observation
    status: verified
    statement: Calibration-only hot/cold ordering increased held-out direct block-selection activation L1 retention relative to original order by 1.424 to 4.294 percentage points across B8/B16/B32 at 20% and 30% target sparsity, while exact expansion retained at most 0.02921% sparsity.
    scope: Pinned EXP-002 Llama 3.2 1B post-SwiGLU activations; layouts learned on prompts P01-P04 and evaluated on P05-P08 across all 16 layers
    evidence:
      - experiment: EXP-007
        analysis: results/EXP-007/m2-layout-diagnostic-20260910-r1/analysis.json
        split: held_out
    calculation: Equal-weight mean across 16 layer aggregates for each matched layout, block-size and target-sparsity configuration
    limitation: Activation-concentration diagnostic on a small prompt set; not language quality, task accuracy, execution latency, or deployable selection evidence
  - id: C014
    type: quantitative_observation
    status: verified
    statement: Hot/cold ordering reduced perplexity relative to both original and LSH ordering in all four matched B8/B16 configurations, but its 20% and 30% block sparsity conditions increased perplexity by 6.799% to 26.399% and all failed the preregistered 5% gate.
    scope: Pinned Llama 3.2 1B, CPU BF16, 16 deterministic held-out WikiText-2 excerpts, 2032 predicted tokens, post-SwiGLU output-norm oracle masks
    evidence:
      - experiment: EXP-008
        manifest: results/EXP-008/m2-hot-cold-screening-20260910/manifest.json
      - experiment: EXP-006
        manifest: results/EXP-006/m2-reordered-screening-20260909/manifest.json
      - experiment: EXP-004
        manifest: results/EXP-004/m2-oracle-screening-20260909/manifest.json
    limitation: Small held-out screen with oracle/reference selection; not a deployable selector, broad quality evaluation, or runtime result
  - id: C015
    type: quantitative_observation
    status: verified
    statement: In staged B8/10% replay profiling, down projection accounted for 58.53-58.66% of median latency, gate/up plus SwiGLU for 40.74-41.06%, and mask compaction for about 0.02%; staging was 7.93-10.45% slower than the interleaved executor.
    scope: Apple M2, FP32, one thread, synthetic 2048/8192 SwiGLU, 16 retained real-model B8 replay masks, three weight/input seeds
    evidence:
      - experiment: EXP-009
        manifest: results/EXP-009/m2-b8-profile-20260910/manifest.json
    calculation: Per-run medians recomputed from 800 retained invocations per timing field
    limitation: Phase timings describe the staged diagnostic rather than the original interleaved kernel exactly; no hardware counters and no end-to-end inference
  - id: C016
    type: quantitative_observation
    status: verified
    statement: The explicit NEON B8 kernel was 3.60-6.70% slower than the existing native B8 kernel and 33.17-36.18% slower than Accelerate dense across three replay runs.
    scope: Apple M2, FP32, one thread, synthetic 2048/8192 SwiGLU, 16 real-model B8 masks at 9.961% realized sparsity
    evidence:
      - experiment: EXP-010
        manifest: results/EXP-010/m2-neon-b8-20260910/manifest.json
    calculation: Comparisons of per-run medians recomputed from 3200 retained timings per implementation
    limitation: One direct intrinsic implementation; does not reject other SIMD schedules, quantization, run coalescing, generated microkernels, or other ARM CPUs
  - id: C017
    type: quantitative_observation
    status: verified
    statement: Coalescing contiguous active B8 runs into Accelerate matrix-vector calls was 28.49-29.79% slower than native B8 and 50.15-50.39% slower than Accelerate dense across three replay runs.
    scope: Apple M2, FP32, one thread, synthetic 2048/8192 SwiGLU, 16 real-model B8 masks at 9.961% realized sparsity
    evidence:
      - experiment: EXP-011
        manifest: results/EXP-011/m2-coalesced-b8-20260910/manifest.json
    calculation: Comparisons of per-run medians recomputed from 3200 retained timings per implementation
    limitation: Masks contained a median 93 active runs; the result does not reject coalescing for layouts with far fewer, longer runs
